name: deployment task CI

# when to start
# 
on:
  #  "pull_request" not equal "git pull"
  #  "pull_request" (PR) is a web-based collaboration feature used to propose, review, and ask to merge code to the main branch
  #  "git pull" is to update your local computer with code from a remote server (built-in terminal command)
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # give me a new machine with ubuntu latest bec, I will run on it(on github action)

    steps:
    # 1. pull the code from the repo
    # it gits a clone from my repo to run it on the new machine(github actions)
    # bec, it is a new/empty machine so it have not "pyspark_job" & "test_pyspark_job"
    - name: Checkout
      #   uses: actions/checkout@v4 # old version you can find the latest by going to that repo
      uses: actions/checkout@v7.0.1 # this is the latest version

    # 2. Setup Python
    - name: Setup Python
      # uses: actions/setup-python@v5
      uses: actions/setup-python@v7.0.0 # the latest version
      with:
        python-version: "3.10" # best practice to define a static virsion

    # 3. Install The Dependencies (pyspark-pytest) any library if needed
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyspark==3.5.6 pytest==8.4.2

    # 4. start the test Pytest
    - name: Run PySpark Unit Tests
      run: |
        pytest test_pyspark_job.py -v